# Render blueprint.
#
# Describes the deployed services so they can be recreated rather than
# remembered. Secrets are marked `sync: false`, which means Render prompts for
# them in the dashboard and never reads them from this file — so this stays
# committable.
#
# The frontend is not here: it is a Next.js app deployed on Vercel from the
# `frontend/` directory. Only the API runs on Render.

services:
  - type: web
    name: agenlate-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend

    # The package installs itself; there is no requirements.txt by design, so
    # dependencies live in one place.
    buildCommand: pip install --upgrade pip && pip install -e .

    # A factory rather than a module-level app: importing the module should not
    # require a populated environment.
    startCommand: uvicorn agenlate.main:create_app --factory --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    # Only rebuild when the backend changes. Without this, every frontend
    # commit redeploys the API and burns free instance hours.
    buildFilter:
      paths:
        - backend/**
        - render.yaml

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: API_ENV
        value: production

      # The Vercel origin, e.g. https://agenlate.vercel.app — no trailing
      # slash, no path. Comma-separate several (a custom domain as well as the
      # vercel.app one). Production refuses a wildcard, so this must name the
      # real origin, and a browser on any origin not listed is refused.
      - key: API_CORS_ORIGINS
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Bypasses row-level security entirely. Backend only, never the frontend.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # No user's OpenRouter key here, ever. Under BYOK the key arrives per run
      # from the user's browser and is never read from configuration.
      #
      # This one is ours: the key a new account's few free runs are paid from.
      # Leave it unset and free runs are off. When setting it, create a key at
      # OpenRouter used for nothing else and give it a credit limit there.
      - key: TRIAL_OPENROUTER_KEY
        sync: false
      - key: TRIAL_MODEL
        value: qwen/qwen3.7-flash
      - key: TRIAL_RUNS_PER_USER
        value: "3"
      - key: TRIAL_TOTAL_RUNS
        value: "250"
      - key: TRIAL_RUN_SPEND_CAP_USD
        value: "0.08"

      - key: OPENROUTER_APP_URL
        value: https://agenlate.com
      - key: OPENROUTER_APP_TITLE
        value: Agenlate

      # Termination guarantees. Every run stops for a named reason.
      - key: RUN_MAX_TURNS
        value: "25"
      - key: RUN_SPEND_CAP_USD
        value: "1.00"
      - key: RUN_STALL_REPEAT_LIMIT
        value: "3"
      - key: RUN_NO_PROGRESS_LIMIT
        value: "3"
      - key: RUN_UNPRICED_CALL_LIMIT
        value: "10"
      - key: RUN_TOOL_ROUNDS_PER_DISPATCH
        value: "5"
