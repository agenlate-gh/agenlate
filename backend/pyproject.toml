[project]
name = "agenlate"
version = "0.1.0"
description = "Agenlate backend — Supervisor agent and roundtable orchestration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "supabase>=2.5",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Integration tests need a real Supabase project, so they are deselected by
# default: the everyday suite runs with no credentials and no network.
# Run them with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: exercises a real Supabase project; needs credentials in .env",
]
